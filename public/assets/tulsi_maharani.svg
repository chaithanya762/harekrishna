<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF8C00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A1410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32CD32"/>
      <stop offset="60%" stop-color="#228B22"/>
      <stop offset="100%" stop-color="#006400"/>
    </linearGradient>
    <linearGradient id="manjariGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BA55D3"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Divine Background -->
  <rect width="400" height="400" fill="#140E0A" rx="200"/>
  <circle cx="200" cy="200" r="190" fill="url(#auraGlow)"/>

  <!-- Ornate Golden Marble Vrindavan Pot -->
  <!-- Base Pedestal -->
  <rect x="130" y="310" width="140" height="20" fill="url(#potGrad)" rx="5"/>
  <rect x="140" y="290" width="120" height="20" fill="url(#marbleGrad)" rx="3"/>

  <!-- Main Planter Body -->
  <path d="M 145 290 L 125 200 L 275 200 L 255 290 Z" fill="url(#potGrad)"/>
  <!-- Decorative Floral Relief on Pot -->
  <circle cx="200" cy="245" r="22" fill="#FFD700" opacity="0.9"/>
  <circle cx="200" cy="245" r="14" fill="#8B0000"/>
  <path d="M 200 225 L 200 265 M 180 245 L 220 245" stroke="#FFD700" stroke-width="3"/>

  <!-- Golden Pot Rim -->
  <ellipse cx="200" cy="200" rx="78" ry="16" fill="url(#potGrad)"/>
  <ellipse cx="200" cy="200" rx="70" ry="12" fill="#3D2B1F"/>

  <!-- Sacred Soil -->
  <ellipse cx="200" cy="200" rx="68" ry="10" fill="#2A1B10"/>

  <!-- Main Stems -->
  <path d="M 200 200 Q 195 150 170 110" stroke="#556B2F" stroke-width="6" fill="none"/>
  <path d="M 200 200 Q 205 140 230 100" stroke="#556B2F" stroke-width="6" fill="none"/>
  <path d="M 200 200 L 200 80" stroke="#556B2F" stroke-width="7" fill="none"/>
  <path d="M 190 160 Q 140 130 130 110" stroke="#556B2F" stroke-width="4" fill="none"/>
  <path d="M 210 160 Q 260 130 270 110" stroke="#556B2F" stroke-width="4" fill="none"/>

  <!-- Tulsi Leaves (Lush Green Clusters) -->
  <!-- Left Branch Leaves -->
  <ellipse cx="145" cy="115" rx="18" ry="10" transform="rotate(-30 145 115)" fill="url(#leafGrad)"/>
  <ellipse cx="160" cy="125" rx="16" ry="9" transform="rotate(-10 160 125)" fill="url(#leafGrad)"/>
  <ellipse cx="130" cy="100" rx="15" ry="8" transform="rotate(-45 130 100)" fill="url(#leafGrad)"/>

  <!-- Right Branch Leaves -->
  <ellipse cx="255" cy="115" rx="18" ry="10" transform="rotate(30 255 115)" fill="url(#leafGrad)"/>
  <ellipse cx="240" cy="125" rx="16" ry="9" transform="rotate(10 240 125)" fill="url(#leafGrad)"/>
  <ellipse cx="270" cy="100" rx="15" ry="8" transform="rotate(45 270 100)" fill="url(#leafGrad)"/>

  <!-- Center Bush Leaves -->
  <ellipse cx="185" cy="130" rx="20" ry="11" transform="rotate(-20 185 130)" fill="url(#leafGrad)"/>
  <ellipse cx="215" cy="130" rx="20" ry="11" transform="rotate(20 215 130)" fill="url(#leafGrad)"/>
  <ellipse cx="200" cy="110" rx="22" ry="12" fill="url(#leafGrad)"/>
  <ellipse cx="180" cy="90" rx="18" ry="10" transform="rotate(-30 180 90)" fill="url(#leafGrad)"/>
  <ellipse cx="220" cy="90" rx="18" ry="10" transform="rotate(30 220 90)" fill="url(#leafGrad)"/>

  <!-- Purple Tulsi Manjari Blossoms (Flowers at Top Spikes) -->
  <g filter="url(#glow)">
    <!-- Top Main Spikes -->
    <path d="M 200 80 L 200 40" stroke="url(#manjariGrad)" stroke-width="4" stroke-dasharray="3,3"/>
    <circle cx="200" cy="40" r="4" fill="#E6E6FA"/>
    <circle cx="198" cy="50" r="3.5" fill="#D8BFD8"/>
    <circle cx="202" cy="60" r="4" fill="#DA70D6"/>

    <!-- Left Spike -->
    <path d="M 170 110 L 155 70" stroke="url(#manjariGrad)" stroke-width="3" stroke-dasharray="3,3"/>
    <circle cx="155" cy="70" r="3.5" fill="#E6E6FA"/>
    <circle cx="158" cy="80" r="3" fill="#DA70D6"/>

    <!-- Right Spike -->
    <path d="M 230 100 L 245 60" stroke="url(#manjariGrad)" stroke-width="3" stroke-dasharray="3,3"/>
    <circle cx="245" cy="60" r="3.5" fill="#E6E6FA"/>
    <circle cx="242" cy="70" r="3" fill="#DA70D6"/>
  </g>

  <!-- Golden Diya Lamps at Base of Pot -->
  <g filter="url(#glow)">
    <!-- Left Diya -->
    <path d="M 100 320 Q 115 335 130 320 Z" fill="#FFD700"/>
    <ellipse cx="115" cy="315" rx="5" ry="9" fill="#FF4500"/>
    <ellipse cx="115" cy="317" rx="3" ry="6" fill="#FFD700"/>

    <!-- Right Diya -->
    <path d="M 270 320 Q 285 335 300 320 Z" fill="#FFD700"/>
    <ellipse cx="285" cy="315" rx="5" ry="9" fill="#FF4500"/>
    <ellipse cx="285" cy="317" rx="3" ry="6" fill="#FFD700"/>
  </g>

  <!-- Floating Divine Sparkles -->
  <circle cx="160" cy="50" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="240" cy="45" r="2.5" fill="#FFD700" opacity="0.9"/>
  <circle cx="190" cy="30" r="3" fill="#FFF" opacity="0.9" filter="url(#glow)"/>
</svg>
